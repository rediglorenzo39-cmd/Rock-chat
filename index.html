<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1f1f1f; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; border-bottom: 1px solid #333; }
    
    #chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { background: #2a2a2a; padding: 10px 15px; border-radius: 8px; max-width: 75%; word-break: break-word; }
    .message.mine { background: #0056b3; align-self: flex-end; }
    
    #input-container { padding: 15px; background: #1f1f1f; display: flex; gap: 10px; border-top: 1px solid #333; }
    input { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #2a2a2a; color: #fff; font-size: 16px; }
    button { padding: 10px 20px; border-radius: 6px; border: none; background: #007bff; color: #fff; font-weight: bold; cursor: pointer; }
    button:hover { background: #0056b3; }

    /* Painel de Chamada Recebida */
    #painel-chamada {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    #painel-chamada h2 { font-size: 24px; text-align: center; }
    .botoes-chamada { display: flex; gap: 20px; }
    .btn-atender { background: #28a745; font-size: 18px; padding: 15px 30px; }
    .btn-recusar { background: #dc3545; font-size: 18px; padding: 15px 30px; }
  </style>
</head>
<body>

  <header>Rock Chat 🎸</header>

  <!-- Área de Mensagens / Chat -->
  <div id="chat-container">
    <div class="message">Bem-vindo ao Rock Chat! Digite algo abaixo ou simule uma chamada para testar.</div>
  </div>

  <!-- Botão temporário para teste de chamada (remova ou adapte pro seu Firebase depois) -->
  <div style="padding: 10px; text-align: center; background: #1f1f1f;">
    <button onclick="simularRecebimentoChamada()" style="background: #ffc107; color: #000;">Simular Chamada Recebida</button>
  </div>

  <!-- Caixa de Envio -->
  <div id="input-container">
    <input type="text" id="mensagem-input" placeholder="Digite sua mensagem...">
    <button onclick="enviarMensagem()">Enviar</button>
  </div>

  <!-- Tela de Chamada Recebida (Alerta Visual, Som e Vibração) -->
  <div id="painel-chamada">
    <h2 id="texto-chamada">📞 Alguém está te ligando...</h2>
    <div class="botoes-chamada">
      <button class="btn-atender" onclick="atenderChamada()">Atender</button>
      <button class="btn-recusar" onclick="recusarChamada()">Recusar</button>
    </div>
  </div>

  <!-- SCRIPT COMPLETO DO ROCK CHAT + CORREÇÃO DE ÁUDIO/VIBRAÇÃO/NOTIFICAÇÃO -->
  <script>
    // 1. Configuração do Som de Chamada (Garantido em HTTPS)
    const ringtone = new Audio('https://assets.mixkit.co/active_storage/sfx/2865/2865-preview.mp3');
    ringtone.loop = true;

    let audioDestravado = false;
    let intervaloVibracao = null;

    // 2. Destrava o som e a vibração no primeiro toque em QUALQUER lugar da tela (Essencial para o Vercel/HTTPS)
    document.addEventListener('click', () => {
      if (!audioDestravado) {
        ringtone.play().then(() => {
          ringtone.pause();
          ringtone.currentTime = 0;
          audioDestravado = true;
          console.log("Rock Chat: Áudio e hardware destravados com sucesso!");
        }).catch(err => console.log("Aguardando interação:", err));
      }
    }, { once: true });

    // 3. Pede permissão de notificação logo ao carregar a página
    window.addEventListener('load', () => {
      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission().then(permission => {
          console.log("Permissão de notificação:", permission);
        });
      }
    });

    // 4. FUNÇÃO DE DISPARO DA CHAMADA (Chame isso quando o Firebase detectar uma ligação)
    function ativarAlertaChamadaRockChat(nomeQuemLigou) {
      // A. Toca o Som
      ringtone.currentTime = 0;
      ringtone.play().catch(e => console.log("Erro ao tocar som:", e));

      // B. Vibra o celular continuamente
      if ("vibrate" in navigator) {
        try {
          navigator.vibrate([500, 500, 500, 500]);
          if (!intervaloVibracao) {
            intervaloVibracao = setInterval(() => {
              try {
                navigator.vibrate([500, 500]);
              } catch (e) {}
            }, 1200);
          }
        } catch (e) {
          console.log("Vibração falhou:", e);
        }
      }

      // C. Dispara a Notificação Nativa flutuante
      if ("Notification" in window && Notification.permission === "granted") {
        try {
          const options = {
            body: `${nomeQuemLigou || 'Alguém'} está te ligando no Rock Chat!`,
            icon: 'https://cdn-icons-png.flaticon.com/512/724/724773.png',
            vibrate: [500, 500, 500],
            tag: 'rockchat-chamada',
            renotify: true,
            requireInteraction: true
          };
          const notificacao = new Notification("📞 Rock Chat - Chamada!", options);
          notificacao.onclick = function() {
            window.focus();
            this.close();
          };
        } catch (e) {
          console.log("Erro na notificação:", e);
        }
      }

      // D. Mostra o painel visual na tela do chat
      document.getElementById('texto-chamada').innerText = `📞 ${nomeQuemLigou || 'Alguém'} está te ligando...`;
      document.getElementById('painel-chamada').style.display = 'flex';
    }

    // 5. FUNÇÃO PARA DESATIVAR O ALERTA (Quando atender ou recusar)
    function desativarAlertaChamadaRockChat() {
      ringtone.pause();
      ringtone.currentTime = 0;
      
      if ("vibrate" in navigator) {
        navigator.vibrate(0);
      }
      if (intervaloVibracao) {
        clearInterval(intervaloVibracao);
        intervaloVibracao = null;
      }

      document.getElementById('painel-chamada').style.display = 'none';
    }

    // Funções de Ação dos Botões da Chamada
    function atenderChamada() {
      desativarAlertaChamadaRockChat();
      alert("Chamada atendida!");
      // Coloque aqui sua lógica do Firebase para conectar a chamada
    }

    function recusarChamada() {
      desativarAlertaChamadaRockChat();
      alert("Chamada recusada.");
      // Coloque aqui sua lógica do Firebase para encerrar a chamada
    }

    // Função de simulação (para você testar direto no celular agora)
    function simularRecebimentoChamada() {
      ativarAlertaChamadaRockChat("João Rock");
    }

    // Funções normais do Chat
    function enviarMensagem() {
      const input = document.getElementById('mensagem-input');
      const texto = input.value.trim();
      if (!texto) return;

      const container = document.getElementById('chat-container');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message mine';
      msgDiv.innerText = texto;
      container.appendChild(msgDiv);

      input.value = '';
      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
