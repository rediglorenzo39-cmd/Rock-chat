<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RockChat - Perfil e Temas</title>
    
    <!-- Seus estilos CSS integrados -->
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Container principal do perfil */
        .perfil-container {
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 16px;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }

        /* --- TEMA PADRÃO (Dark Clean) --- */
        .perfil-container.tema-padrao {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333;
        }
        .tema-padrao .perfil-btn {
            background-color: #007bff;
            color: white;
        }

        /* --- TEMA FOGO (Laranja, Vermelho e Amarelo) --- */
        .perfil-container.tema-fogo {
            background: linear-gradient(135deg, #ff4500, #ff8c00, #ff2a00);
            color: #ffffff;
            border: 2px solid #ffd700;
            box-shadow: 0 0 25px rgba(255, 69, 0, 0.6);
        }
        .tema-fogo .perfil-btn {
            background-color: #1a0000;
            color: #ffaa00;
            border: 1px solid #ffd700;
        }

        /* --- TEMA FLOR (Tons de Rosa e Magenta) --- */
        .perfil-container.tema-flor {
            background: linear-gradient(135deg, #ff69b4, #ff1493, #db7093);
            color: #ffffff;
            border: 2px solid #ffb6c1;
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.6);
        }
        .tema-flor .perfil-btn {
            background-color: #4a0e2e;
            color: #ffb6c1;
            border: 1px solid #ffb6c1;
        }

        /* --- TEMA NEON (Azul Ciano / Cyber) --- */
        .perfil-container.tema-neon {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #00ffcc;
            border: 2px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
        }
        .tema-neon .perfil-btn {
            background-color: #00ffcc;
            color: #0f2027;
        }

        /* Elementos internos */
        .perfil-container h2 {
            margin-top: 0;
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
        }

        .perfil-info {
            margin-bottom: 20px;
        }

        .perfil-info label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .perfil-info input, .perfil-info select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.25);
            color: inherit;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        .perfil-info select option {
            background: #222;
            color: #fff;
        }

        .perfil-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .perfil-btn:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }
    </style>
</head>
<body>

    <!-- Estrutura HTML do Perfil -->
    <div id="perfil-view" class="perfil-container tema-padrao">
        <h2>Editar Perfil - RockChat</h2>
        
        <div class="perfil-info">
            <label for="inputNome">Nome de Usuário (Único):</label>
            <input type="text" id="inputNome" placeholder="Digite seu nome...">
        </div>

        <div class="perfil-info">
            <label for="selectTema">Tema de Fundo do Perfil:</label>
            <select id="selectTema">
                <option value="padrao">Padrão (Dark)</option>
                <option value="fogo">🔥 Fogo (Laranja / Vermelho)</option>
                <option value="flor">🌸 Flor (Rosa / Magenta)</option>
                <option value="neon">⚡ Neon (Ciano / Cyber)</option>
            </select>
        </div>

        <button class="perfil-btn" onclick="salvarPerfilCompleto()">Salvar Alterações</button>
    </div>

    <!-- Scripts do Firebase (Certifique-se de que sua inicializacao do firebase ja esta carregada no app) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // CONFIGURAÇÃO DO FIREBASE (Substitua pelos dados reais do seu projeto do RockChat se já não estiverem em outro arquivo)
        /*
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        */

        const db = firebase.firestore();

        // Quando a página carregar, puxa os dados do usuário logado
        firebase.auth().onAuthStateChanged(async (user) => {
            if (user) {
                carregarDadosPerfil(user.uid);
            } else {
                console.log("Usuário não logado.");
            }
        });

        async function carregarDadosPerfil(userId) {
            try {
                const doc = await db.collection('users').doc(userId).get();
                if (doc.exists) {
                    const dados = doc.data();
                    
                    // Preenche os campos com o que já está salvo
                    document.getElementById('inputNome').value = dados.username || '';
                    document.getElementById('selectTema').value = dados.temaPerfil || 'padrao';
                    
                    // Aplica o tema visualmente
                    aplicarTemaVisual(dados.temaPerfil || 'padrao');
                }
            } catch (error) {
                console.error("Erro ao carregar perfil:", error);
            }
        }

        // Altera o tema visualmente em tempo real quando o usuário mexe no select
        document.getElementById('selectTema').addEventListener('change', (e) => {
            aplicarTemaVisual(e.target.value);
        });

        function aplicarTemaVisual(tema) {
            const container = document.getElementById('perfil-view');
            container.className = `perfil-container tema-${tema}`;
        }

        // Função de salvar com validação estrita de nome duplicado
        async function salvarPerfilCompleto() {
            const user = firebase.auth().currentUser;
            if (!user) {
                alert("Erro: Você precisa estar logado para salvar!");
                return;
            }

            const nomeDigitado = document.getElementById('inputNome').value.trim();
            const temaEscolhido = document.getElementById('selectTema').value;

            if (!nomeDigitado) {
                alert("O nome de usuário não pode ficar vazio!");
                return;
            }

            // Padroniza para minúsculo para evitar que criem "User" e "user" como se fossem diferentes
            const usernameLimpo = nomeDigitado.toLowerCase();

            try {
                // 1. VERIFICAÇÃO DE NOME DUPLICADO NO FIRESTORE
                const usuariosRef = db.collection('users');
                const consulta = await usuariosRef.where('username', '==', usernameLimpo).get();

                let nomePertenceOutro = false;
                consulta.forEach(doc => {
                    // Se o documento encontrado não for o ID do próprio usuário logado, o nome já existe
                    if (doc.id !== user.uid) {
                        nomePertenceOutro = true;
                    }
                });

                if (nomePertenceOutro) {
                    alert("❌ Erro: Esse nome de usuário já está em uso por outra pessoa. Escolha outro!");
                    return; // Para o código aqui e não deixa salvar
                }

                // 2. SALVANDO NO BANCO DE DADOS SE TIVER LIVRE
                await db.collection('users').doc(user.uid).set({
                    username: usernameLimpo,
                    nomeExibicao: nomeDigitado, // Mantém as letras maiúsculas/minúsculas originais que ele digitou
                    temaPerfil: temaEscolhido
                }, { merge: true });

                alert("✅ Perfil e tema atualizados com sucesso!");

            } catch (error) {
                console.error("Erro ao salvar dados:", error);
                alert("Ocorreu um erro ao salvar. Verifique o console.");
            }
        }
    </script>
</body>
</html>
